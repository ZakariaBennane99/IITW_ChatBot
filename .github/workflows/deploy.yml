name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Deploy when pushing to the main branch (update if your default branch is different)

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Use Node.js version 18 (adjust if needed)

      # Step 3: Install dependencies and build the app
      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      # Debugging Step (Optional)
      - name: Check Deploy Context
        run: |
          echo "Repository URL: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Output Directory: ./dist"

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # The build output directory (default for Vite)
          force_orphan: true
